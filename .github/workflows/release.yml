# SimpleClock 三平台自动构建发布
#
# 用法：推送形如 v0.0.2 的 tag 即触发，三平台在 GitHub 云端并行构建安装包，
# 自动上传到该 tag 的 GitHub Release 附件。
#   1. 发布前先同步版本号（pubspec.yaml / update_config.dart / 打包脚本见 README）
#   2. git tag v0.0.2 && git push origin v0.0.2
#   3. Actions 完成后到 Releases 页确认三个安装包
#
# 注意：macOS 产物未签名（无 Apple Developer 证书），正式分发前需自行签名公证。

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Windows installer (Inno Setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Inject version into installer script
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/#define MyAppVersion \"[^\"]*\"/#define MyAppVersion \"$VERSION\"/" packaging/windows/simple_clock.iss

      - name: Compile installer
        shell: bash
        run: |
          ISCC="C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if [ ! -f "$ISCC" ]; then
            ISCC="$(powershell -NoProfile -Command "(Get-Command ISCC).Source" 2>/dev/null | tr -d '\r')"
          fi
          echo "Using ISCC: $ISCC"
          "$ISCC" packaging/windows/simple_clock.iss

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SimpleClock-setup-*.exe

  release-macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build macOS release
        run: flutter build macos --release

      - name: Create DMG
        shell: bash
        run: |
          # macOS 使用 BSD sed，-i 语法与 GNU sed 不同，这里用 python3 注入版本号
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - <<EOF
          import re
          p = "packaging/macos/build_dmg.sh"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'^VERSION=".*"', "VERSION=\"$VERSION\"", s, flags=re.M)
          open(p, "w", encoding="utf-8").write(s)
          EOF
          bash packaging/macos/build_dmg.sh

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SimpleClock-*.dmg

  release-linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          # libayatana-appindicator3-dev: tray_manager 托盘支持所需的系统库
          sudo apt-get install -y ninja-build clang libgtk-3-dev libayatana-appindicator3-dev

      - name: Build Linux release
        run: flutter build linux --release

      - name: Create AppImage
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^VERSION=\".*\"/VERSION=\"$VERSION\"/" packaging/linux/build_appimage.sh
          bash packaging/linux/build_appimage.sh

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SimpleClock-*.AppImage
